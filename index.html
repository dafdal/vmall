lassList.remove("show")},2200)}function renderQty(){qtyNum.textContent=qty;totalCount.textContent=qty;totalPrice.textContent=fmt(PRICE*qty);$("#qtyMinus").disabled=qty<=1}$("#qtyMinus").addEventListener("click",function(){if(qty>1){qty--;renderQty()}});$("#qtyPlus").addEventListener("click",function(){if(qty<99){qty++;renderQty()}});renderQty();/* ===== 加入购物车 ===== */$("#addBtn").addEventListener("click",function(){cart+=qty;badge.textContent=cart;badge.classList.add("show");toast("已加入购物车：现榨椰汁 × "+qty+" 瓶")});$("#cartBtn").addEventListener("click",function(){toast(cart>0?"购物车共 "+cart+" 瓶现榨椰汁":"购物车还是空的，快去加购吧")});/* ===== 支付密码六格 ===== */var cells=$$(".pay-cell"),payMask=$("#payMask"),okMask=$("#okMask"),payErr=$("#payErr");function clearCells(){cells.forEach(function(c){c.value="";c.classList.remove("filled","err")});payErr.textContent="";cells[0].focus()}function getCode(){var s="";cells.forEach(function(c){s+=c.value});return s}cells.forEach(function(c,i){c.addEventListener("input",function(){var v=c.value.replace(/\D/g,"");if(v.length>1){v=v.slice(-1);c.value=v}if(v){c.classList.add("filled");if(i<5){cells[i+1].focus();if(cells[i+1].select)cells[i+1].select()}}else{c.classList.remove("filled")}});c.addEventListener("keydown",function(e){if(e.key==="Backspace"&&!c.value&&i>0){cells[i-1].focus();cells[i-1].value="";cells[i-1].classList.remove("filled")}if(e.key==="Enter"){tryPay()}});c.addEventListener("paste",function(e){e.preventDefault();var t=(e.clipboardData.getData("text")||"").replace(/\D/g,"").slice(0,6);for(var k=0;k<t.length;k++){cells[k].value=t[k];cells[k].classList.add("filled")}if(t.length<6){cells[t.length].focus()}else{tryPay()}})});/* ===== 购买流程 ===== */$("#buyBtn").addEventListener("click",function(){clearCells();$("#payQty").textContent=qty;$("#payTotal").textContent=fmt(PRICE*qty);payMask.classList.add("show")});function closePay(){payMask.classList.remove("show")}function tryPay(){var code=getCode();if(code.length<6){payErr.textContent="请输入完整的 6 位支付密码";cells.forEach(function(c,i){if(!c.value){c.classList.add("err");c.focus();return}});return}payErr.textContent="";payMask.classList.remove("show");$("#okQty").textContent=qty;$("#okTotal").textContent=fmt(PRICE*qty);okMask.classList.add("show")}function closeOk(){okMask.classList.remove("show")}$("#payConfirm").addEventListener("click",tryPay);$("#payCancel").addEventListener("click",closePay);$("#payClose").addEventListener("click",closePay);$("#okDone").addEventListener("click",closeOk);payMask.addEventListener("click",function(e){if(e.target===payMask)closePay()});okMask.addEventListener("click",function(e){if(e.target===okMask)closeOk()});document.addEventListener("keydown",function(e){if(e.key==="Escape"){closePay();closeOk()}});})();</script></body></html>
